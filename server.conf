server {
	listen 4242;
	server_name halnuma.42.fr; 
	host localhost;
	root path/;
	index index.html;
	#test comment
	error_page 404.html;
	client_max_body_size 10;

	location / {
		allow_methods GET;
		autoindex on;
	}

	location /test {
		allow_methods GET POST;
	}
}

server {
	listen 8080;
	server_name secros.42.fr; 
	host localhost;
	root path/;
	index index.html;
	#test comment
	error_page 404.html;
	client_max_body_size 20;

	location 4 {
		allow_methods GET;
		autoindex off;
	}

	location /yo {
		allow_methods GET POST;
	}

	location /cgi-bin {
		cgi_ext .py;
		cgi_path /usr/bin/python3;
	}

	location .php {
        allow_methods GET POST;
        cgi_ext .php;
        cgi_path /usr/bin/php-cgi;
    }
}