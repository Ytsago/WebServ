server {
	listen 4242;
	host localhost;
	root website/;
	index index.html;
	client_max_body_size 10;

	location / {
		allow_methods GET;
		autoindex on;
	}

	location /test {
		allow_methods GET POST;
	}
}

server {
	listen 8080;
	root website/;
	client_max_body_size 20000000;

	location / {
		autoindex on;
	}

	location /test/ {
		return 301 /yo/;
	}

	location /yo/ {
		index index.html;
		allow_methods GET;
	}

	location /uploads/ {
		autoindex off;
	}

	location /yo/yes/ {
		root website/;
		allow_methods GET POST;
	}

	location .php {
		root website/script/;
        allow_methods GET POST;
        cgi_ext .php;
        cgi_path /usr/bin/php-cgi8.1;
    }

	location .py {
		root website/script/;
        allow_methods GET POST;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
    
    location .sh {
		root website/script/;
        allow_methods GET POST;
        cgi_ext .sh;
        cgi_path /usr/bin/bash;
    }
}
